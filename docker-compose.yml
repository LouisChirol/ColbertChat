version: "3.8"

name: turgot

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      web:
        aliases:
          - turgot-frontend

  backend:
    image: ${BACKEND_IMAGE:-turgot-backend:local}
    build: ./backend
    restart: unless-stopped
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./backend/logs:/app/logs
      - ./database/chroma_db:/app/database/chroma_db
      - ./database/last_update.txt:/app/database/last_update.txt
    depends_on:
      - redis
    networks:
      web:
        aliases:
          - turgot-backend
      internal:
      monitoring:
        aliases:
          - turgot-backend

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --appendonly no
    restart: unless-stopped
    networks:
      - internal

  db_updater:
    build: ./database
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - ./database/chroma_db:/app/database/chroma_db
      - ./database/data:/app/database/data
      - ./database/last_update.txt:/app/database/last_update.txt
    profiles:
      - maintenance
    restart: "no"
    networks:
      - internal

networks:
  web:
    external: true
  monitoring:
    name: lchirol-monitoring
    external: true
  internal:
    driver: bridge
