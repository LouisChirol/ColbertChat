# Legacy nginx config — NOT used on the current production server.
# Production edge: Caddy (lchirol-infra) on the external `web` Docker network
# routes turgot.louischirol.fr → turgot-frontend:3000 and /api/* → turgot-backend:8000.
# turgotchat.fr redirects to turgot.louischirol.fr in Caddy.
# Keep this file for reference or hosts that still terminate TLS with nginx.

# Rate limiting zones (defense in depth on top of the app-level limiter).
limit_req_zone $binary_remote_addr zone=turgot_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=turgot_conn:10m;

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name turgotchat.fr www.turgotchat.fr api.turgotchat.fr;
    return 301 https://$host$request_uri;
}

# HTTPS configuration for main domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turgotchat.fr www.turgotchat.fr;

    ssl_certificate /etc/letsencrypt/live/turgotchat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turgotchat.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # Frontend configuration
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS configuration for API subdomain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.turgotchat.fr;

    ssl_certificate /etc/letsencrypt/live/turgotchat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turgotchat.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 15 MB to accommodate /transcribe audio uploads; app enforces the same cap.
    client_max_body_size 15m;

    # Backend configuration (backend container is bridged and published on 127.0.0.1:8000)
    location / {
        limit_req zone=turgot_api burst=15 nodelay;
        limit_conn turgot_conn 20;

        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
} 