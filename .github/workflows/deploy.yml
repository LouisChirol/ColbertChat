name: Deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: louischirol/turgotchat-backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      - name: Install backend dependencies from lockfile
        run: uv sync --frozen --project backend
      - name: Lint backend
        run: uv run --project backend ruff check app tests
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      - name: Install backend dependencies from lockfile
        run: uv sync --frozen --project backend
      - name: Run thin backend tests
        working-directory: backend
        run: uv run pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run happy-path frontend test
        working-directory: frontend
        run: npm run test:e2e

  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy with health check and rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SHA_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' SHA_TAG='${SHA_TAG}' bash -s" <<'EOF'
          set -euo pipefail
          DEPLOY_ROOT="${DEPLOY_PATH:-$HOME/turgot}"
          NEW_IMAGE="ghcr.io/louischirol/turgotchat-backend:${SHA_TAG}"
          cd "${DEPLOY_ROOT}"

          PREVIOUS_IMAGE=""
          BACKEND_CONTAINER="$(docker compose ps -q backend || true)"
          if [ -n "${BACKEND_CONTAINER}" ]; then
            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' "${BACKEND_CONTAINER}" || true)"
          fi

          echo "BACKEND_IMAGE=${NEW_IMAGE}" > .env.deploy
          docker compose --env-file .env --env-file .env.deploy pull backend
          docker compose --env-file .env --env-file .env.deploy up -d backend

          sleep 10
          if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
            echo "Deploy succeeded with ${NEW_IMAGE}"
            exit 0
          fi

          if [ -z "${PREVIOUS_IMAGE}" ]; then
            echo "Deploy failed and no previous image was found for rollback"
            exit 1
          fi

          echo "Health check failed, rolling back to ${PREVIOUS_IMAGE}"
          echo "BACKEND_IMAGE=${PREVIOUS_IMAGE}" > .env.deploy
          docker compose --env-file .env --env-file .env.deploy up -d backend
          sleep 10
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          exit 1
          EOF
