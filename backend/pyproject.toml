[project]
name = "turgot-backend"
version = "0.1.0"
description = "RAG-powered chatbot for French public administration information"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "gunicorn>=22.0.0",
    "python-dotenv>=0.19.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-mistralai>=0.0.1",
    "langgraph>=0.2.39",
    "loguru>=0.7.0",
    "redis>=4.5.0",
    "mistralai>=1.7.0",
    "mistral-common>=1.0.0",
    "langchain-redis>=0.2.0",
    "chromadb>=1.0.9",
    "langchain-community>=0.3.23",
    "ipykernel>=6.29.5",
    "langchain-chroma>=0.2.4",
    "reportlab>=4.1.0",
    "markdown-it-py>=3.0.0",
    "Pillow>=10.0.0",
    "jupyter>=1.1.1",
    "soundfile>=0.13.1",
    "numpy>=1.26.4",
    "gtts>=2.5.4",
    "requests>=2.32.3",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "prometheus-client>=0.21.1",
    "pytest>=8.3.2",
    "ruff>=0.6.9",
    "sentence-transformers",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
